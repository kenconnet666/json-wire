name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }} 编译与测试
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: 编译、运行测试并生成源码包与 javadoc 包（字节码按 release 17 生成）
        run: ./mvnw --batch-mode verify
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: java-${{ matrix.java }}-reports
          path: java/*/target/surefire-reports/
          retention-days: 7

  typescript:
    name: TypeScript 编译与测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
          cache: true
          cache_dependency_path: typescript/pnpm-lock.yaml
      - name: 编译并运行测试
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: 确认发布的包内容（只打包不发布）
        working-directory: typescript/packages/json-wire
        run: pnpm pack --dry-run
